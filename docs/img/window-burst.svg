<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="t d">
  <title id="t">Window and burst drawing flow</title>
  <desc id="d">A rectangle is clipped to the screen, the address window is set once with CASET, RASET and RAMWR, and then all pixels are streamed. The controller advances through the window row by row.</desc>
  <style>
    :root { --bg:#ffffff; --box:#eef3fb; --ln:#9db0cc; --tx:#17202e; --dim:#566379; --acc:#2f6fed; --accbg:#dce8ff; --scr:#1b2233; --win:#2f6fed; --pix:#7fb0ff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#10141c; --box:#1a2230; --ln:#3b4a63; --tx:#e7ecf5; --dim:#97a3b8; --acc:#6fa3ff; --accbg:#1c2c4d; --scr:#0a0e16; --win:#6fa3ff; --pix:#3d68b8; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--tx); font-size: 14px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .bg { fill: var(--bg); }
    .box { fill: var(--box); stroke: var(--ln); stroke-width: 1.5; }
    .acc { fill: var(--accbg); stroke: var(--acc); stroke-width: 2; }
    .arrow { stroke: var(--dim); stroke-width: 2; fill: none; marker-end: url(#ah); }
    .h { font-weight: 600; font-size: 15px; }
    .s { fill: var(--dim); font-size: 12.5px; }
    .c { text-anchor: middle; }
    .scr { fill: var(--scr); }
    .win { fill: var(--pix); stroke: var(--win); stroke-width: 2; }
    .row { stroke: #ffffff; stroke-opacity: .55; stroke-width: 1.5; fill: none; marker-end: url(#ah2); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a97ad"/></marker>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ffffff" fill-opacity=".7"/></marker>
  </defs>
  <rect class="bg" width="760" height="440"/>

  <!-- Left: the steps -->
  <rect class="box" x="16" y="16" width="360" height="62" rx="10"/>
  <text class="h" x="32" y="42">1. Clip to the screen</text>
  <text class="s" x="32" y="62" >gfx_clip_rect(&amp;x, &amp;y, &amp;w, &amp;h) returns 0 if nothing is left</text>

  <rect class="acc" x="16" y="104" width="360" height="132" rx="10"/>
  <text class="h" x="32" y="130">2. Set the window once: 11 bus writes</text>
  <text class="mono" x="32" y="154">cmd  0x2A  CASET</text><text class="mono s" x="200" y="154">+ x0 hi, x0 lo, x1 hi, x1 lo</text>
  <text class="mono" x="32" y="176">cmd  0x2B  RASET</text><text class="mono s" x="200" y="176">+ y0 hi, y0 lo, y1 hi, y1 lo</text>
  <text class="mono" x="32" y="198">cmd  0x2C  RAMWR</text><text class="mono s" x="200" y="198">pixels follow</text>
  <text class="s" x="32" y="222">3 commands and 8 parameters, whatever the size of the window</text>

  <rect class="box" x="16" y="262" width="360" height="102" rx="10"/>
  <text class="h" x="32" y="288">3. Burst: one data word per pixel</text>
  <text class="mono" x="32" y="312">for (i = 0; i &lt; w * h; i++)</text>
  <text class="mono" x="32" y="332">    gfx_port_data(color);</text>
  <text class="s" x="32" y="352">The controller advances by itself, row by row</text>

  <path class="arrow" d="M196 78 L196 102"/>
  <path class="arrow" d="M196 236 L196 260"/>

  <rect class="box" x="16" y="388" width="360" height="36" rx="10"/>
  <text class="s" x="32" y="411">Pixel by pixel: 12 writes per pixel. Burst: w x h + 11.</text>

  <!-- Right: the screen -->
  <text class="h" x="400" y="34">240 x 240 screen</text>
  <rect class="scr" x="400" y="46" width="340" height="340" rx="4"/>
  <!-- window rectangle: x 90..270 (of 240) scaled 340/240 = 1.4167 -->
  <rect class="win" x="520" y="106" width="170" height="130"/>
  <text class="s c" x="605" y="76">window (x0, y0) to (x1, y1)</text>
  <path class="row" d="M528 118 L682 118"/>
  <path class="row" d="M528 138 L682 138"/>
  <path class="row" d="M528 158 L682 158"/>
  <path class="row" d="M528 178 L682 178"/>
  <path class="row" d="M528 198 L682 198"/>
  <path class="row" d="M528 218 L682 218"/>
  <text class="s c" x="605" y="262">pixels fill the window left to right,</text>
  <text class="s c" x="605" y="280">top to bottom</text>
  <circle cx="523" cy="118" r="3.5" fill="#ffffff"/>
  <text class="s" x="411" y="62" style="fill:#c4cde0">(0, 0)</text>
  <text class="s" x="680" y="378" style="fill:#c4cde0;text-anchor:end">(239, 239)</text>
</svg>
