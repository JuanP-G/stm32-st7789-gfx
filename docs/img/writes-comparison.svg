<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 574" role="img" aria-labelledby="t d">
  <title id="t">Bus writes: window and burst compared with pixel by pixel</title>
  <desc id="d">Horizontal bars on a logarithmic axis. For every primitive, window and burst needs far fewer bus writes than pixel by pixel drawing, except for a single pixel where both cost 12.</desc>
  <style>
    :root { --bg:#ffffff; --tx:#17202e; --dim:#566379; --grid:#dfe5ef; --burst:#2f6fed; --naive:#c9d2e3; }
    @media (prefers-color-scheme: dark) { :root { --bg:#10141c; --tx:#e7ecf5; --dim:#97a3b8; --grid:#273146; --burst:#6fa3ff; --naive:#3b4a63; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--tx); font-size: 13px; }
    .bg { fill: var(--bg); } .dim { fill: var(--dim); font-size: 12px; } .h { font-weight: 600; font-size: 15px; }
    .grid { stroke: var(--grid); stroke-width: 1; } .burst { fill: var(--burst); } .naive { fill: var(--naive); }
    .r { text-anchor: end; }
  </style>
  <rect class="bg" width="800" height="574"/>
  <text class="h" x="20" y="28">Bus writes per drawing operation (logarithmic axis)</text>
  <rect class="burst" x="20" y="40" width="12" height="10"/><text class="dim" x="38" y="49">window + burst (this library)</text>
  <rect class="naive" x="240" y="40" width="12" height="10"/><text class="dim" x="258" y="49">pixel by pixel (12 writes per pixel)</text>
  <line class="grid" x1="190.0" y1="60" x2="190.0" y2="500"/>
  <text class="dim" x="190.0" y="518" text-anchor="middle">1</text>
  <line class="grid" x1="268.6" y1="60" x2="268.6" y2="500"/>
  <text class="dim" x="268.6" y="518" text-anchor="middle">10</text>
  <line class="grid" x1="347.1" y1="60" x2="347.1" y2="500"/>
  <text class="dim" x="347.1" y="518" text-anchor="middle">100</text>
  <line class="grid" x1="425.7" y1="60" x2="425.7" y2="500"/>
  <text class="dim" x="425.7" y="518" text-anchor="middle">1,000</text>
  <line class="grid" x1="504.3" y1="60" x2="504.3" y2="500"/>
  <text class="dim" x="504.3" y="518" text-anchor="middle">10,000</text>
  <line class="grid" x1="582.9" y1="60" x2="582.9" y2="500"/>
  <text class="dim" x="582.9" y="518" text-anchor="middle">100,000</text>
  <line class="grid" x1="661.4" y1="60" x2="661.4" y2="500"/>
  <text class="dim" x="661.4" y="518" text-anchor="middle">1,000,000</text>
  <line class="grid" x1="740.0" y1="60" x2="740.0" y2="500"/>
  <text class="dim" x="740.0" y="518" text-anchor="middle">10M</text>
  <text class="r" x="180" y="81">One pixel</text>
  <rect class="burst" x="190" y="68" width="84.8" height="12"/>
  <text class="dim" x="280.8" y="78">12</text>
  <rect class="naive" x="190" y="84" width="84.8" height="12"/>
  <text class="dim" x="280.8" y="94">12</text>
  <text class="r" x="180" y="125">Line, 200 px</text>
  <rect class="burst" x="190" y="112" width="182.6" height="12"/>
  <text class="dim" x="378.6" y="122">211</text>
  <rect class="naive" x="190" y="128" width="265.6" height="12"/>
  <text class="dim" x="461.6" y="138">2,400</text>
  <text class="r" x="180" y="169">Diagonal line</text>
  <rect class="burst" x="190" y="156" width="239.3" height="12"/>
  <text class="dim" x="435.3" y="166">1,112</text>
  <rect class="naive" x="190" y="172" width="269.0" height="12"/>
  <text class="dim" x="465.0" y="182">2,652</text>
  <text class="r" x="180" y="213">Text, 12 chars</text>
  <rect class="burst" x="190" y="200" width="257.9" height="12"/>
  <text class="dim" x="453.9" y="210">1,918</text>
  <rect class="naive" x="190" y="216" width="340.3" height="12"/>
  <text class="dim" x="536.3" y="226">21,432</text>
  <text class="r" x="180" y="257">Icon 32 x 32</text>
  <rect class="burst" x="190" y="244" width="236.9" height="12"/>
  <text class="dim" x="432.9" y="254">1,035</text>
  <rect class="naive" x="190" y="260" width="321.3" height="12"/>
  <text class="dim" x="517.3" y="270">12,288</text>
  <text class="r" x="180" y="301">Filled circle r60</text>
  <rect class="burst" x="190" y="288" width="322.8" height="12"/>
  <text class="dim" x="518.8" y="298">12,844</text>
  <rect class="naive" x="190" y="304" width="403.9" height="12"/>
  <text class="dim" x="599.9" y="314">138,156</text>
  <text class="r" x="180" y="345">Rectangle 100 x 60</text>
  <rect class="burst" x="190" y="332" width="296.9" height="12"/>
  <text class="dim" x="492.9" y="342">6,011</text>
  <rect class="naive" x="190" y="348" width="381.6" height="12"/>
  <text class="dim" x="577.6" y="358">72,000</text>
  <text class="r" x="180" y="389">Image 120 x 80</text>
  <rect class="burst" x="190" y="376" width="312.9" height="12"/>
  <text class="dim" x="508.9" y="386">9,611</text>
  <rect class="naive" x="190" y="392" width="397.7" height="12"/>
  <text class="dim" x="593.7" y="402">115,200</text>
  <text class="r" x="180" y="433">Full screen</text>
  <rect class="burst" x="190" y="420" width="374.0" height="12"/>
  <text class="dim" x="570.0" y="430">57,611</text>
  <rect class="naive" x="190" y="436" width="458.8" height="12"/>
  <text class="dim" x="654.8" y="446">691,200</text>
  <text class="r" x="180" y="477">Dashboard page</text>
  <rect class="burst" x="190" y="464" width="408.4" height="12"/>
  <text class="dim" x="604.4" y="474">157,844</text>
  <rect class="naive" x="190" y="480" width="490.5" height="12"/>
  <text class="dim" x="686.5" y="490">1,747,740</text>
</svg>
